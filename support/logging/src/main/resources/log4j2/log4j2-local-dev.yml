Configuration:
  name: NamuLocalDevLogger
  status: info

  Properties:
    Property:
      name: LOG_DIR
      value: "./logs"

  Appenders:
    Console:
      name: NamuConsoleAppender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%style{%d}{cyan} %highlight{%-5level} [%style{%t}{bright,blue}] %style{%C}{bright,yellow}: [%X{traceId}] - %msg%n%throwable"
    RollingFile:
      name: NamuRollingFileAppender
      fileName: "${LOG_DIR}/app.log"
      filePattern: "${LOG_DIR}/app-%d{yyyy-MM-dd}.%i.log"
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{35} [%X{memberId}] - %msg%n"
      immediateFlush: false
      append: false
      Policies:
        SizeBasedTriggeringPolicy:
          size: "20 MB"
      DefaultRollOverStrategy:
        max: 10
        Delete:
          basePath: "${LOG_DIR}"
          maxDepth: "1"
          IfAccumulatedFileCount:
            exceeds: "3"
    Sentry:
      name: SentryAppender
      dsn: "https://bc619ab5ea8c4d745dc2bd4d56cbb05d@o4506773350973440.ingest.us.sentry.io/4506773410807808"
      contextTags: "traceId"
      minimumEventLevel: "WARN"
      minimumBreadcrumbLevel: "INFO"

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: NamuConsoleAppender
        - ref: NamuRollingFileAppender
        - ref: SentryAppender
    AsyncLogger:
      - name: NamuAsyncLogger
        level: debug
        additivity: false
        includeLocation: false
        AppenderRef:
          - ref: NamuConsoleAppender
          - ref: NamuRollingFileAppender
    Logger:
      - name: "org.hibernate.orm.jdbc.bind"
        level: TRACE
        additivity: false
        AppenderRef:
          - ref: NamuConsoleAppender
          - ref: NamuRollingFileAppender
          - ref: SentryAppender
      - name: "org.hibernate.SQL"
        level: DEBUG
        additivity: false
        AppenderRef:
          - ref: NamuConsoleAppender
          - ref: NamuRollingFileAppender
          - ref: SentryAppender
